<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çevrimdışı · Sınav Koçu</title>
<style>
  html,body{margin:0;height:100%;background:#EFECE3;color:#202A3D;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .box{max-width:340px}
  .seal{width:76px;height:76px;border-radius:50%;border:2px solid #A6763A;margin:0 auto 18px;

  h1{font-size:20px;margin:0 0 8px;font-family:Georgia,serif;}
  p{color:#5B6478;line-height:1.5;margin:0 0 18px;font-size:14px;}
  button{background:#A6763A;color:#fff;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;}
</style></head><body>
  <div class="box">
    <div class="seal">YK</div>
    <h1>Çevrimdışısın</h1>
    <p>İnternet bağlantısı yok. Bağlantı geldiğinde uygulama otomatik olarak en güncel haliyle açılacak.</p>
    <button onclick="location.reload()">Yeniden dene</button>
  </div>
</body></html>
